name: Windows preview

on:
  workflow_dispatch:
  push:
    branches: [windows-preview]
  pull_request:
    paths: ['windows/**', 'tests/**', '.github/workflows/windows-preview.yml']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r windows/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: windows
      - if: runner.os == 'Windows'
        run: python windows/smoke_gui.py
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executables
        shell: pwsh
        run: ./windows/Build-Windows.ps1
      - name: Verify packaged CLI
        shell: pwsh
        run: |
          & ./windows/dist/ewb/ewb.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI check failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Egress-Workbench-Windows-x64
          path: windows/dist/Egress-Workbench-Windows-x64-0.1.0.zip
          if-no-files-found: error
